<!doctype html>
<html lang="pt-PT" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pulso</title>
  <meta name="description" content="Pulso — plano alimentar para turnos e treino.">
  <meta name="theme-color" id="themeColor" content="#f2f2ef">
  <script>try { var t = JSON.parse(localStorage.getItem('planoLean.v1')).profile.tema; if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  // Propostas de visual: abrir com ?visual=suave|energia|minimal|bento (fica guardado, também na app instalada, até carregar em "Sair")
  try {
    var q = new URLSearchParams(location.search).get('visual');
    if (q !== null) { localStorage.setItem('pulso.look', q || 'atual'); history.replaceState(history.state, '', location.pathname + location.hash); }
    var l = localStorage.getItem('pulso.look');
    if (l) {
      document.documentElement.dataset.preview = '1';
      if (l !== 'atual') document.documentElement.dataset.look = l;
      var f = document.createElement('link'); f.rel = 'stylesheet';
      f.href = 'https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter+Tight:wght@400;500;600;700;800&family=Geist:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap';
      document.head.appendChild(f);
    }
  } catch (e) {}</script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

</head>

  <script src="data.js"></script>

</body>
</html>
